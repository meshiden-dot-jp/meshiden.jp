<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity Web Player | DIgitalArt</title>
    <style>
      #unity-loading-bar,
      #unity-logo,
      #unity-footer,
      #unity-logo-title-footer,
      #unity-progress-bar-empty,
      #unity-progress-bar-full,
      #unity-warning {
        display: none !important;
      }

      html, body {
        margin: 0;
        padding: 0;
        overflow: hidden; /* ここでスクロールバーを出さない */
      }

      /* Canvas を全画面にする */
      #unity-canvas {
        width: 100% !important;
        height: 100% !important;
      }

      /* 全体の div も全画面に伸ばす */
      #unity-container {
        width: 100% !important;
        height: 100% !important;
        margin: 0;
        padding: 0;
      }
    </style>
  </head>
  <body style="text-align: center; padding: 0; border: 0; margin: 0;">
    <canvas id="unity-canvas" width=960 height=600 tabindex="-1" style="width: 960px; height: 600px; background: #231F20"></canvas>
    <script src="Build/Build.loader.js"></script>
    <script>
      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);

        var canvas = document.querySelector("#unity-canvas");
        canvas.style.width = "100%";
        canvas.style.height = "100%";
        canvas.style.position = "fixed";

        document.body.style.textAlign = "left";
      }

      var canvas = document.querySelector("#unity-canvas");

      createUnityInstance(
        canvas,
        {
          arguments: [],
          dataUrl: "Build/Build.data",
          frameworkUrl: "Build/Build.framework.js",
          codeUrl: "Build/Build.wasm",
          streamingAssetsUrl: "StreamingAssets",
          companyName: "DefaultCompany",
          productName: "DIgitalArt",
          productVersion: "0.1",
        },
        function (progress) {
          // 0.0〜1.0
          try {
            window.parent.postMessage({ type: "UNITY_PROGRESS", value: progress }, "*");
          } catch (e) {}
        }
      )
        .then(function (unityInstance) {
          try {
            window.parent.postMessage({ type: "UNITY_LOADED" }, "*");
          } catch (e) {}
        })
        .catch(function (message) {
          try {
            window.parent.postMessage({ type: "UNITY_LOAD_ERROR", message: String(message) }, "*");
          } catch (e) {}
          alert(message);
        });
    </script>

  </body>
</html>
