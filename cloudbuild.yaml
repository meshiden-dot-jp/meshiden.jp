steps:
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        docker build \
          -t gcr.io/$PROJECT_ID/meshiden-jp \
          --build-arg GA_ID=$$GA_ID \
          --build-arg NEXT_PUBLIC_RECAPTCHA_CLIENT_KEY=$$NEXT_PUBLIC_RECAPTCHA_CLIENT_KEY \
          --build-arg RECAPCHA_SECRET_KEY=$$RECAPCHA_SECRET_KEY \
          --build-arg NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME=$$NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME \
          --build-arg NEXT_PUBLIC_API_KEY=$$NEXT_PUBLIC_API_KEY \
          --build-arg NEXT_PUBLIC_SERVICE_DOMAIN=$$NEXT_PUBLIC_SERVICE_DOMAIN \
          .

    secretEnv:
      - GA_ID
      - NEXT_PUBLIC_RECAPTCHA_CLIENT_KEY
      - RECAPCHA_SECRET_KEY
      - NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME
      - NEXT_PUBLIC_API_KEY
      - NEXT_PUBLIC_SERVICE_DOMAIN

images:
  - 'gcr.io/$PROJECT_ID/meshiden-jp'

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/GA_ID/versions/latest
      env: 'GA_ID'
    - versionName: projects/$PROJECT_ID/secrets/NEXT_PUBLIC_RECAPTCHA_CLIENT_KEY/versions/latest
      env: 'NEXT_PUBLIC_RECAPTCHA_CLIENT_KEY'
    - versionName: projects/$PROJECT_ID/secrets/RECAPCHA_SECRET_KEY/versions/latest
      env: 'RECAPCHA_SECRET_KEY'
    - versionName: projects/$PROJECT_ID/secrets/NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME/versions/latest
      env: 'NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME'
    - versionName: projects/$PROJECT_ID/secrets/NEXT_PUBLIC_API_KEY/versions/latest
      env: 'NEXT_PUBLIC_API_KEY'
    - versionName: projects/$PROJECT_ID/secrets/NEXT_PUBLIC_SERVICE_DOMAIN/versions/latest
      env: 'NEXT_PUBLIC_SERVICE_DOMAIN'
